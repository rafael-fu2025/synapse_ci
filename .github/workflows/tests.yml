name: Verified test baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: PHP ${{ matrix.php }} baseline and fresh migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, openssl, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: PHP syntax
        run: find app tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tenant scope lint
        run: php tools/tenant-scope-lint.php
      - name: Runner safety regressions (no database)
        run: python tests/_support/fresh-database-runner-test.py
      - name: DB-free security and correctness regressions
        run: php vendor/bin/phpunit --configuration phpunit.ci.xml --no-coverage
      - name: Migration-backed service regressions on a fresh schema
        run: >-
          python tests/_support/run-fresh-database-tests.py
          tests/unit/QueueServiceTest.php
          tests/unit/AppointmentServiceTest.php
          tests/unit/AuditServiceTest.php
          tests/unit/GuidanceCaseServiceTest.php
          tests/unit/LoginAttemptStoreTest.php
          tests/unit/MobileRealtimeGrantTest.php
          tests/unit/CarouselServiceTest.php
          tests/unit/CarouselLoginSlidesTest.php
          tests/feature/CarouselAdminRoutesTest.php
          tests/feature/CarouselDefaultAssetAccessTest.php
      - name: Queue JavaScript regressions
        run: node --test tests/browser/queue.test.cjs

  ai:
    name: Isolated AI PHP and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, openssl, sqlite3, pdo_sqlite, curl, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every AI PHP test is collected
        run: |
          python -I - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          mariadb = 'tests/unit/AiRecoveryMariaDbTest.php'
          assert Path(mariadb).is_file(), 'MariaDB AI recovery fixture is required by the separate fresh-schema job'
          expected = {p.as_posix() for p in Path('tests').rglob('Ai*Test.php')} - {mariadb}
          collected = {node.text for node in ET.parse('phpunit.ai.xml').iter('file')}
          assert expected == collected, f'Update phpunit.ai.xml: missing={expected - collected}, stale={collected - expected}'
          PY
      - name: Isolated AI PHP regressions (no deployment settings or database)
        run: php vendor/bin/phpunit --configuration phpunit.ai.xml --no-coverage
      - name: Install locked browser test dependencies
        run: npm ci --prefix tests/browser
      - name: Install Chromium and Linux system dependencies
        run: npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - name: All four isolated AI browser suites
        run: npm test --prefix tests/browser
      - name: AI browser test dependency audit
        run: npm audit --prefix tests/browser --audit-level=high

  ai-mariadb:
    name: AI recovery on a disposable MariaDB schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, openssl, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: AI recovery regressions on a fresh schema
        run: python tests/_support/run-fresh-database-tests.py tests/unit/AiRecoveryMariaDbTest.php
