import com.android.build.api.variant.BuildConfigField
import com.android.build.api.variant.ResValue

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Release identity and signing never come from the repository.
 * Set them as Gradle properties (gradle.properties, not committed) or as
 * environment variables in CI:
 *   SYNAPSE_VERSION_CODE, SYNAPSE_VERSION_NAME
 *   SYNAPSE_UPLOAD_STORE_FILE, SYNAPSE_UPLOAD_STORE_PASSWORD,
 *   SYNAPSE_UPLOAD_KEY_ALIAS, SYNAPSE_UPLOAD_KEY_PASSWORD
 */
def releaseValue = { String property, String variable ->
    def fromProperty = findProperty(property)
    def fromEnvironment = System.getenv(variable)
    def value = fromProperty != null ? fromProperty : fromEnvironment
    return value == null || value.toString().trim().isEmpty() ? null : value.toString().trim()
}

def appVersionCode = (releaseValue('SYNAPSE_VERSION_CODE', 'SYNAPSE_VERSION_CODE') ?: '1').toInteger()
def appVersionName = releaseValue('SYNAPSE_VERSION_NAME', 'SYNAPSE_VERSION_NAME') ?: '1.0.0'
def uploadStoreFile = releaseValue('SYNAPSE_UPLOAD_STORE_FILE', 'SYNAPSE_UPLOAD_STORE_FILE')
def uploadStorePassword = releaseValue('SYNAPSE_UPLOAD_STORE_PASSWORD', 'SYNAPSE_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = releaseValue('SYNAPSE_UPLOAD_KEY_ALIAS', 'SYNAPSE_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = releaseValue('SYNAPSE_UPLOAD_KEY_PASSWORD', 'SYNAPSE_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = uploadStoreFile != null && uploadStorePassword != null
        && uploadKeyAlias != null && uploadKeyPassword != null
// Retain the existing explicit local-smoke opt-in, never a silent fallback.
// The release APK inspection gate always rejects a debug certificate, even with this opt-in.
def allowDebugSigning = (releaseValue('SYNAPSE_ALLOW_DEBUG_SIGNING', 'SYNAPSE_ALLOW_DEBUG_SIGNING') ?: 'false').toBoolean()

/**
 * Set to true to run ProGuard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (releaseValue('SYNAPSE_ENABLE_MINIFICATION', 'SYNAPSE_ENABLE_MINIFICATION') ?: 'true').toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.humus.synapse"
    defaultConfig {
        applicationId "com.humus.synapse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        // RNC reflects the namespace, not the suffixed applicationId.
        resValue "string", "build_config_package", "com.humus.synapse"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            debuggable false
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            signingConfig hasReleaseSigning ? signingConfigs.release : (allowDebugSigning ? signingConfigs.debug : null)
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        lanTestRelease {
            initWith release
            debuggable false
            matchingFallbacks = ["release"]
            applicationIdSuffix ".lantest"
            versionNameSuffix "-lan-test"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// dotenv.gradle eagerly writes BuildConfig fields and resources to defaultConfig.
// Clean the mutable DSL before AGP creates variant providers; querying those
// providers inside onVariants is too early on AGP 9.
androidComponents {
    finalizeDsl { dsl ->
        def markerNames = ["SYNAPSE_BUILD_PROFILE", "SYNAPSE_ALLOW_LAN_HTTP"]
        def nativeNames = ["APPLICATION_ID", "BUILD_TYPE", "DEBUG", "VERSION_CODE", "VERSION_NAME"]
        def inheritedNativeFields = dsl.defaultConfig.buildConfigFields.findAll { name, field -> nativeNames.contains(name) }
        def inheritedLabels = dsl.defaultConfig.resValues.findAll { key, field -> field.type == "string" && field.name == "app_name" }

        // Release native identity cannot be shadowed by dotenv. Keep the old
        // debug values at build-type scope instead of changing debug behavior.
        nativeNames.each { dsl.defaultConfig.buildConfigFields.remove(it) }
        inheritedLabels.keySet().each { dsl.defaultConfig.resValues.remove(it) }
        dsl.buildTypes.each { buildType ->
            if (buildType.name == "release" || buildType.name == "lanTestRelease") {
                nativeNames.each { buildType.buildConfigFields.remove(it) }
            } else {
                inheritedNativeFields.each { name, field -> buildType.buildConfigFields.putIfAbsent(name, field) }
            }
            if (buildType.name == "lanTestRelease") {
                buildType.resValues.entrySet().removeAll { it.value.type == "string" && it.value.name == "app_name" }
            } else {
                inheritedLabels.each { key, field -> buildType.resValues.putIfAbsent(key, field) }
            }
        }

        // Authorization names are reserved in every build, including debug.
        ([dsl.defaultConfig] + dsl.buildTypes.toList()).each { dimension ->
            markerNames.each { dimension.buildConfigFields.remove(it) }
            dimension.resValues.entrySet().removeAll { it.value.type == "string" && markerNames.contains(it.value.name) }
        }
    }
    onVariants(selector().all()) { variant ->
        variant.resValues.put(variant.makeResValueKey("string", "build_config_package"),
                new ResValue("com.humus.synapse", "RNC namespace, including suffixed packages"))
        if (variant.buildType == "release" || variant.buildType == "lanTestRelease") {
            def isLanTest = variant.buildType == "lanTestRelease"
            def nativeMarkers = [
                    SYNAPSE_BUILD_PROFILE: isLanTest ? "lan-test" : "production",
                    SYNAPSE_ALLOW_LAN_HTTP: isLanTest ? "true" : "false"
            ]
            nativeMarkers.each { key, value ->
                variant.buildConfigFields.put(key,
                        new BuildConfigField("String", "\"${value}\"".toString(), "Native build profile; never from dotenv"))
                variant.resValues.put(variant.makeResValueKey("string", key),
                        new ResValue(value, "Native build profile; never from dotenv"))
            }
        }
    }
}

// Gate actual release artifact-producing tasks, including qualified/aggregate/abbreviated
// invocations, rather than guessing from gradle.startParameter.taskNames. A JVM unit test
// does not need a signing key. Unsigned distribution artifacts are not a fallback.
def releasePrerequisiteTasks = []
["release", "lanTestRelease"].each { buildType ->
    def capitalized = buildType.substring(0, 1).toUpperCase(Locale.ROOT) + buildType.substring(1)
    def prerequisites = tasks.register("verify${capitalized}ArtifactPrerequisites") {
        group = "verification"
        description = "Verify signer and Firebase prerequisites without exposing credentials"
        doLast {
            if (!hasReleaseSigning && !allowDebugSigning) {
                throw new GradleException("Release signing is not configured. Provide SYNAPSE_UPLOAD_STORE_FILE, "
                        + "SYNAPSE_UPLOAD_STORE_PASSWORD, SYNAPSE_UPLOAD_KEY_ALIAS and SYNAPSE_UPLOAD_KEY_PASSWORD "
                        + "via local Gradle properties or environment variables. No debug signing fallback was used.")
            }
            if (hasReleaseSigning && !file(uploadStoreFile).isFile()) {
                throw new GradleException("The configured release signing file is missing. No artifact will be produced.")
            }
            def firebaseCandidates = [file("src/${buildType}/google-services.json"), file("google-services.json")]
            if (!firebaseCandidates.any { it.isFile() }) {
                throw new GradleException("Firebase configuration is required for ${buildType}. Provide a matching "
                        + "google-services.json for ${buildType == 'lanTestRelease' ? 'com.humus.synapse.lantest' : 'com.humus.synapse'} "
                        + "in app/src/${buildType}/ or app/. Firebase was not disabled or fabricated.")
            }
            if (allowDebugSigning && !hasReleaseSigning) {
                logger.warn("Explicit local-smoke debug signing selected; release APK inspection will reject this artifact.")
            }
        }
    }
    releasePrerequisiteTasks.add(prerequisites)
    // Task names are Strings, not Groovy GStrings: List.contains/in would not
    // match an interpolated GString list and could leave package tasks ungated.
    def artifactTaskNames = ["assemble${capitalized}", "bundle${capitalized}",
            "package${capitalized}", "package${capitalized}Bundle", "sign${capitalized}Bundle",
            "validateSigning${capitalized}"].collect { it.toString() }
    tasks.configureEach { task ->
        if (artifactTaskNames.contains(task.name)) {
            task.dependsOn(prerequisites)
        }
    }
}
tasks.register("verifyReleasePrerequisites") {
    group = "verification"
    dependsOn(releasePrerequisiteTasks)
}

// Keep the existing optional debug bootstrap, but release preflight requires Firebase.
// Applying for variant-only files is essential for the independent .lantest package.
if ([file("google-services.json"), file("src/debug/google-services.json"),
        file("src/release/google-services.json"), file("src/lanTestRelease/google-services.json")].any { it.isFile() }) {
    apply plugin: "com.google.gms.google-services"
}
